  <head>
    <meta charset="UTF-8">
    <title>Bukken Bruses veg 53 - Under Construction</title>

    <meta property="og:url" content="https://bbv53.no/">

    <meta name="twitter:title" content="bbv53 - Under Construction">

    <meta name="twitter:image" content="">
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }
      
      /* Animated background circles */
      .bg-circle {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        animation: float 20s infinite ease-in-out;
      }
      
      .bg-circle:nth-child(1) {
        width: 300px;
        height: 300px;
        top: -100px;
        left: -100px;
        animation-delay: 0s;
      }
      
      .bg-circle:nth-child(2) {
        width: 200px;
        height: 200px;
        bottom: -50px;
        right: -50px;
        animation-delay: 5s;
      }
      
      .bg-circle:nth-child(3) {
        width: 250px;
        height: 250px;
        top: 50%;
        right: -125px;
        animation-delay: 10s;
      }
      
      @keyframes float {
        0%, 100% {
          transform: translateY(0) translateX(0) scale(1);
        }
        33% {
          transform: translateY(-30px) translateX(20px) scale(1.1);
        }
        66% {
          transform: translateY(20px) translateX(-20px) scale(0.9);
        }
      }
      
      .container {
        text-align: center;
        color: white;
        z-index: 10;
        padding: 20px;
        max-width: 800px;
      }
      
      h1 {
        font-size: 3.5rem;
        font-weight: 600;
        margin-bottom: 1rem;
        animation: fadeInDown 1s ease;
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
      }
      
      .subtitle {
        font-size: 1.5rem;
        font-weight: 300;
        margin-bottom: 3rem;
        animation: fadeInUp 1s ease 0.3s both;
        opacity: 0.9;
      }
      
      /* Construction graphic using CSS */
      .construction-graphic {
        margin: 2rem auto 3rem;
        position: relative;
        width: 200px;
        height: 200px;
        animation: fadeIn 1s ease 0.6s both;
      }
      
      /* Cone shape */
      .cone {
        width: 0;
        height: 0;
        border-left: 60px solid transparent;
        border-right: 60px solid transparent;
        border-bottom: 100px solid #ff9800;
        position: absolute;
        top: 50px;
        left: 40px;
        animation: bounce 2s infinite ease-in-out;
      }
      
      .cone::before {
        content: '';
        position: absolute;
        width: 100px;
        height: 20px;
        background: white;
        left: -50px;
        top: 30px;
        border-radius: 2px;
      }
      
      /* Crane arm */
      .crane {
        position: absolute;
        width: 4px;
        height: 120px;
        background: #ffd54f;
        top: 0;
        left: 98px;
        transform-origin: bottom center;
        animation: swing 4s infinite ease-in-out;
      }
      
      .crane::before {
        content: '';
        position: absolute;
        width: 80px;
        height: 4px;
        background: #ffd54f;
        top: 0;
        left: -40px;
      }
      
      .crane::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        background: #ff6b6b;
        border-radius: 4px;
        top: -10px;
        left: -8px;
      }
      
      @keyframes bounce {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      
      @keyframes swing {
        0%, 100% {
          transform: rotate(-5deg);
        }
        50% {
          transform: rotate(5deg);
        }
      }
      
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 0.9;
          transform: translateY(0);
        }
      }
      
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      
      /* Progress bar animation */
      .progress-container {
        width: 100%;
        max-width: 400px;
        height: 8px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        overflow: hidden;
        margin: 2rem auto;
        animation: fadeIn 1s ease 0.9s both;
      }
      
      .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
        border-radius: 10px;
        animation: progress 3s infinite ease-in-out;
        box-shadow: 0 0 20px rgba(79, 172, 254, 0.8);
      }
      
      @keyframes progress {
        0% {
          width: 0%;
        }
        50% {
          width: 70%;
        }
        100% {
          width: 0%;
        }
      }
      
      .message {
        font-size: 1.2rem;
        font-weight: 300;
        animation: fadeIn 1s ease 1.2s both;
        opacity: 0.8;
      }
      
      /* Responsive design */
      @media (max-width: 768px) {
        h1 {
          font-size: 2.5rem;
        }
        
        .subtitle {
          font-size: 1.2rem;
        }
        
        .construction-graphic {
          transform: scale(0.8);
        }
        
        .message {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>
    
    <div class="container">
      <h1>Under Construction</h1>
      <p class="subtitle">We're building something amazing</p>
      
      <div class="construction-graphic">
        <div class="crane"></div>
        <div class="cone"></div>
      </div>
      
      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>
      
      <p class="message">Stay tuned for updates</p>
    </div>
